name: tempo_tempo
description: "Flutter-Web-Portierung von tempo, tempo – fit in Formen."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.3
  http: ^1.5.0
  material_ui: ^1.1.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - public/data/nouns.json
    - public/data/shop.json
    - public/data/wheels.json
